<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VahanaShare – Bikes and vehicles on hire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--surface:#fff;--ink:#12262b;--mute:#587076;--line:#d3dfe1;--brand:#0e5a63;--onbrand:#fff;--accent:#f2b705;--onaccent:#12262b;--ok:#17794a;--bad:#b3341f;--tint:#e1eef0;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1d;--surface:#15272b;--ink:#e8f1f2;--mute:#8fa8ad;--line:#27403f;--brand:#4fb3bf;--onbrand:#08262a;--tint:#1b3338;--ok:#52c58a;--bad:#ff8a72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1d;--surface:#15272b;--ink:#e8f1f2;--mute:#8fa8ad;--line:#27403f;--brand:#4fb3bf;--onbrand:#08262a;--tint:#1b3338;--ok:#52c58a;--bad:#ff8a72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.1;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--brand);margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
nav{display:flex;gap:4px}
.lnk{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}
.lnk:hover,.lnk.on{background:var(--tint);color:var(--ink)}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--tint);color:var(--ink)}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
.hero{background:var(--brand);color:var(--onbrand);border-radius:20px;padding:28px 24px;margin-bottom:24px}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:800;max-width:14em}
.hero p{max-width:34em;opacity:.9;margin:10px 0 20px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface);color:var(--ink);padding:14px;border-radius:14px;border-left:8px solid var(--accent)}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tile{height:110px;display:grid;place-items:center;font-size:54px;background:var(--tint);border-bottom:2px dashed var(--line)}
.card .in{padding:14px;display:grid;gap:8px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{font:800 20px "Bricolage Grotesque",sans-serif}
.mute{color:var(--mute);font-size:14px}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--tint)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.sec{margin:28px 0 12px;font-size:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:800 28px "Bricolage Grotesque",sans-serif;color:var(--brand)}
.chart{display:grid;gap:8px}
.cb{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;font-size:14px}
.cb i{display:block;height:14px;border-radius:7px;background:var(--brand);min-width:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.modal{position:fixed;inset:0;background:rgba(5,20,24,.6);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:18px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.tabs{display:flex;gap:6px}
.msg{font-weight:600;min-height:1.4em}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
#bell{position:relative}
.dot{position:absolute;top:2px;right:2px;background:var(--accent);color:var(--onaccent);font-size:11px;font-weight:800;border-radius:99px;padding:0 5px}
.notes{position:absolute;right:16px;top:100%;width:min(340px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;max-height:60vh;overflow:auto}
.note{font-size:14px;padding:8px;border-radius:8px;background:var(--tint)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:0 16px 30px}
@media (prefers-reduced-motion:no-preference){.dlg{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
</head>
<body>
<header><div class="bar" id="top"></div></header>
<main id="app"></main>
<footer>Demo build: data is saved only in this browser. Admin demo login: admin@vahana.com / admin123</footer>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>{const t=new Date(d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const ICON={bike:"🚲",scooter:"🛵",motorbike:"🏍️",car:"🚗"};
const KEY="vahanashare-v1";
let db,uid=null,f={from:plus(1),to:plus(2),type:"",q:"",max:""},bellOpen=false;

function seed(){return{
 users:[{id:1,name:"Admin",email:"admin@vahana.com",pass:"admin123",role:"admin"},{id:2,name:"Anita",email:"anita@example.com",pass:"demo1234",role:"user"}],
 vehicles:[
  {id:1,name:"City Cruiser Bicycle",type:"bike",price:150,loc:"Marine Drive",seats:1,desc:"Light 7-speed bicycle with basket and lock. Good for short city rides.",active:true},
  {id:2,name:"Trail Mountain Bike",type:"bike",price:250,loc:"Fort Kochi",seats:1,desc:"21-speed bike with front suspension and helmet included.",active:true},
  {id:3,name:"Honda Activa Scooter",type:"scooter",price:450,loc:"Edappally",seats:2,desc:"Easy automatic scooter. Two helmets and a full tank at pickup.",active:true},
  {id:4,name:"Royal Enfield Classic",type:"motorbike",price:900,loc:"Vyttila",seats:2,desc:"350cc touring motorbike. Licence check at pickup.",active:true},
  {id:5,name:"Maruti Swift Hatchback",type:"car",price:1800,loc:"Kakkanad",seats:5,desc:"Petrol manual hatchback with AC. Fuel not included.",active:true},
  {id:6,name:"Toyota Innova Crysta",type:"car",price:3200,loc:"Ernakulam South",seats:7,desc:"Seven-seater for family trips. Driver not included.",active:true}],
 bookings:[
  {id:1,vid:3,uid:2,from:plus(3),to:plus(5),total:1350,status:"confirmed",created:iso(new Date())},
  {id:2,vid:5,uid:2,from:plus(-6),to:plus(-4),total:5400,status:"completed",created:plus(-9)}],
 notes:[{uid:2,text:"Welcome to VahanaShare! Your booking for Honda Activa Scooter is confirmed.",t:iso(new Date()),read:false}],
 next:{v:7,b:3,u:3}}}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db)db=seed();try{uid=JSON.parse(localStorage.getItem(KEY+"-s"))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(KEY+"-s",JSON.stringify(uid))}catch(e){}}
const me=()=>db.users.find(u=>u.id===uid);
const veh=id=>db.vehicles.find(v=>v.id===id);
const busy=(vid,a,b,skip)=>db.bookings.filter(x=>x.vid===vid&&x.status==="confirmed"&&x.id!==skip&&x.from<=b&&a<=x.to);
const validRange=(a,b)=>a&&b&&a<=b;
function notify(u,text){db.notes.unshift({uid:u,text,t:iso(new Date()),read:false})}
function toast(t){const e=document.createElement("div");e.id="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}

function top(){
 const u=me(),r=route(),n=u?db.notes.filter(x=>x.uid===uid&&!x.read).length:0;
 $("#top").innerHTML=`<button class="logo" data-a="go" data-v="browse">VahanaShare</button>
 <nav aria-label="Main"><button class="lnk ${r==="browse"?"on":""}" data-a="go" data-v="browse">Browse</button>
 <button class="lnk ${r==="bookings"?"on":""}" data-a="go" data-v="bookings">My bookings</button>
 ${u&&u.role==="admin"?`<button class="lnk ${r==="admin"?"on":""}" data-a="go" data-v="admin">Admin</button>`:""}</nav>
 ${u?`<button class="lnk" id="bell" data-a="bell" aria-label="Notifications">🔔${n?`<span class="dot">${n}</span>`:""}</button><span class="mute">${esc(u.name)}</span><button class="btn alt sm" data-a="logout">Log out</button>`
 :`<button class="btn sm" data-a="auth">Log in or sign up</button>`}
 ${bellOpen&&u?`<div class="notes" role="region" aria-label="Notifications">${db.notes.filter(x=>x.uid===uid).map(x=>`<div class="note">${esc(x.text)}<div class="mute">${x.t}</div></div>`).join("")||`<div class="mute">No notifications yet.</div>`}</div>`:""}`;
}
const route=()=>{const h=location.hash.slice(1);return["bookings","admin"].includes(h)?h:"browse"};

function results(){
 const ok=validRange(f.from,f.to);
 let list=db.vehicles.filter(v=>v.active&&(!f.type||v.type===f.type)&&(!f.q||(v.name+v.loc).toLowerCase().includes(f.q.toLowerCase()))&&(!f.max||v.price<=+f.max))
  .map(v=>({v,free:ok?!busy(v.id,f.from,f.to).length:true}));
 list.sort((a,b)=>b.free-a.free);
 $("#res").innerHTML=list.length?list.map(({v,free})=>`<article class="card"><div class="tile" aria-hidden="true">${ICON[v.type]}</div><div class="in">
 <div class="row"><h3>${esc(v.name)}</h3><span class="pill ${free?"ok":"bad"}">${free?"Free for your dates":"Booked on your dates"}</span></div>
 <div class="mute">${esc(v.loc)}, seats ${v.seats}</div>
 <div class="row"><span class="price">${inr(v.price)}<span class="mute"> per day</span></span><button class="btn sm" data-a="open" data-v="${v.id}">View and book</button></div></div></article>`).join("")
 :`<div class="empty">No vehicles match these filters. Clear the price limit or choose another type.</div>`;
}
function browse(){
 $("#app").innerHTML=`<section class="hero"><h1>Pick a ride for the days you need it.</h1>
 <p>Bikes, scooters, motorbikes and cars from nearby owners. Choose your dates and see what is free right now.</p>
 <div class="filters" role="search">
 <label>From<input type="date" id="ff" value="${f.from}" min="${iso(new Date())}"></label>
 <label>To<input type="date" id="ft" value="${f.to}" min="${iso(new Date())}"></label>
 <label>Vehicle type<select id="fy"><option value="">All types</option>${Object.keys(ICON).map(t=>`<option value="${t}" ${f.type===t?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></label>
 <label>Search<input id="fq" placeholder="Name or area" value="${esc(f.q)}"></label>
 <label>Max price per day<input id="fm" type="number" min="0" step="50" placeholder="Any" value="${f.max}"></label></div></section>
 <h2 class="sec" style="margin-top:0">Available vehicles</h2><div class="grid" id="res"></div>`;
 results();
}
function bookings(){
 const u=me();
 if(!u){$("#app").innerHTML=`<div class="empty">Log in to see your bookings.<br><br><button class="btn" data-a="auth">Log in or sign up</button></div>`;return}
 const mine=db.bookings.filter(b=>b.uid===uid).sort((a,b)=>b.from.localeCompare(a.from));
 $("#app").innerHTML=`<h2 class="sec" style="margin-top:0">My bookings</h2>`+(mine.length?`<div class="panel"><table><thead><tr><th>Vehicle</th><th>Dates</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(b=>`<tr><td>${esc(veh(b.vid)?.name||"Removed vehicle")}</td><td>${b.from} to ${b.to}</td><td>${inr(b.total)}</td><td><span class="pill ${b.status==="confirmed"?"ok":b.status==="cancelled"?"bad":""}">${b.status}</span></td><td>${b.status==="confirmed"&&b.from>=iso(new Date())?`<button class="btn warn sm" data-a="cancel" data-v="${b.id}">Cancel booking</button>`:""}</td></tr>`).join("")}</tbody></table></div>`
 :`<div class="empty">You have no bookings yet. Browse vehicles to make your first one.<br><br><button class="btn" data-a="go" data-v="browse">Browse vehicles</button></div>`);
}
function admin(){
 const u=me();
 if(!u||u.role!=="admin"){$("#app").innerHTML=`<div class="empty">The admin dashboard is only for administrators. Log in with an admin account.</div>`;return}
 const live=db.bookings.filter(b=>b.status!=="cancelled"),rev=live.reduce((s,b)=>s+b.total,0);
 const counts=db.vehicles.map(v=>({n:v.name,c:live.filter(b=>b.vid===v.id).length})),mx=Math.max(1,...counts.map(x=>x.c));
 $("#app").innerHTML=`<h2 class="sec" style="margin-top:0">Admin dashboard</h2>
 <div class="stats"><div class="stat"><b>${db.vehicles.length}</b>Vehicles</div><div class="stat"><b>${live.length}</b>Bookings</div><div class="stat"><b>${db.users.length}</b>Users</div><div class="stat"><b>${inr(rev)}</b>Booking value</div></div>
 <div class="panel"><h3>Bookings per vehicle</h3><div class="chart" style="margin-top:12px">${counts.map(x=>`<div class="cb"><span>${esc(x.n)}</span><i style="width:${x.c/mx*100}%"></i><b>${x.c}</b></div>`).join("")}</div></div>
 <div class="panel"><h3>Add a vehicle</h3><div class="form" style="margin-top:10px">
 <label>Name<input id="an"></label><label>Type<select id="at">${Object.keys(ICON).map(t=>`<option>${t}</option>`).join("")}</select></label>
 <label>Price per day (₹)<input id="ap" type="number" min="1"></label><label>Area<input id="al"></label><label>Seats<input id="as" type="number" min="1" value="1"></label>
 <label>Description<input id="ad"></label><button class="btn" data-a="addv">Add vehicle</button></div><div class="msg bad" id="am"></div></div>
 <div class="panel"><h3>Vehicles</h3><table><thead><tr><th>Name</th><th>Type</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${db.vehicles.map(v=>`<tr><td>${esc(v.name)}</td><td>${v.type}</td><td>${inr(v.price)}</td><td><span class="pill ${v.active?"ok":"bad"}">${v.active?"Available":"Hidden"}</span></td><td><button class="btn alt sm" data-a="togv" data-v="${v.id}">${v.active?"Hide":"Show"}</button> <button class="btn warn sm" data-a="delv" data-v="${v.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>
 <div class="panel"><h3>All bookings</h3><table><thead><tr><th>Vehicle</th><th>User</th><th>Dates</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${db.bookings.map(b=>`<tr><td>${esc(veh(b.vid)?.name||"Removed")}</td><td>${esc(db.users.find(x=>x.id===b.uid)?.name||"?")}</td><td>${b.from} to ${b.to}</td><td>${inr(b.total)}</td><td>${b.status}</td><td>${b.status==="confirmed"?`<button class="btn warn sm" data-a="cancel" data-v="${b.id}">Cancel</button>`:""}</td></tr>`).join("")}</tbody></table></div>
 <div class="panel"><h3>Users</h3><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${db.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td></tr>`).join("")}</tbody></table></div>`;
}
function render(){top();({browse,bookings,admin})[route()]()}

function modal(html){$("#layer").innerHTML=`<div class="modal" data-a="shade"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`}
function close(){$("#layer").innerHTML=""}
function detail(id){
 const v=veh(id),a=validRange(f.from,f.to)?f.from:plus(1),b=validRange(f.from,f.to)?f.to:plus(2);
 const up=db.bookings.filter(x=>x.vid===id&&x.status==="confirmed"&&x.to>=iso(new Date())).sort((x,y)=>x.from.localeCompare(y.from));
 modal(`<div class="row"><h2>${esc(v.name)}</h2><button class="btn alt sm" data-a="close">Close</button></div>
 <div class="tile" style="border-radius:12px">${ICON[v.type]}</div><p style="margin:0">${esc(v.desc)}</p>
 <div class="mute">Pickup area: ${esc(v.loc)}. Seats: ${v.seats}. Rate: ${inr(v.price)} per day.</div>
 <div class="mute">${up.length?"Already booked: "+up.map(x=>x.from+" to "+x.to).join(", "):"No upcoming bookings. All dates are free."}</div>
 <div class="form"><label>From<input type="date" id="bf" value="${a}" min="${iso(new Date())}" data-vid="${id}"></label><label>To<input type="date" id="bt" value="${b}" min="${iso(new Date())}"></label></div>
 <div class="msg" id="bm"></div><button class="btn" id="bb" data-a="book" data-v="${id}">Book now</button>`);
 quote(id);
}
function quote(id){
 const v=veh(id),a=$("#bf").value,b=$("#bt").value,m=$("#bm"),btn=$("#bb");
 if(!validRange(a,b)){m.className="msg bad";m.textContent="Choose an end date on or after the start date.";btn.disabled=true;return}
 if(busy(id,a,b).length){m.className="msg bad";m.textContent="This vehicle is already booked on some of these days. Try other dates.";btn.disabled=true;return}
 m.className="msg ok";m.textContent=`Free. ${days(a,b)} day(s), total ${inr(days(a,b)*v.price)}.`;btn.disabled=false;
}
function authModal(tab="login"){
 modal(`<div class="row"><h2>${tab==="login"?"Log in":"Create your account"}</h2><button class="btn alt sm" data-a="close">Close</button></div>
 <div class="tabs"><button class="lnk ${tab==="login"?"on":""}" data-a="authtab" data-v="login">Log in</button><button class="lnk ${tab==="reg"?"on":""}" data-a="authtab" data-v="reg">Sign up</button></div>
 ${tab==="reg"?`<label>Full name<input id="un" autocomplete="name"></label>`:""}
 <label>Email<input id="ue" type="email" autocomplete="email"></label>
 <label>Password<input id="up" type="password" autocomplete="${tab==="reg"?"new-password":"current-password"}" minlength="6"></label>
 <div class="msg bad" id="um"></div><button class="btn" data-a="${tab==="login"?"login":"register"}">${tab==="login"?"Log in":"Create account"}</button>
 <div class="mute">Demo users: anita@example.com / demo1234, or admin@vahana.com / admin123.</div>`);
}
const A={
 go:v=>{bellOpen=false;location.hash=v;render()},
 close:()=>close(),shade:(v,el)=>{},
 open:v=>detail(+v),auth:()=>authModal("login"),authtab:v=>authModal(v),
 bell:()=>{bellOpen=!bellOpen;if(!bellOpen){db.notes.forEach(n=>{if(n.uid===uid)n.read=true});save()}top()},
 logout:()=>{uid=null;bellOpen=false;save();render();toast("You are logged out")},
 login:()=>{const e=$("#ue").value.trim().toLowerCase(),p=$("#up").value,u=db.users.find(x=>x.email===e&&x.pass===p);
  if(!u){$("#um").textContent="Email or password is wrong. Check both and try again.";return}
  uid=u.id;save();close();render();toast("Welcome back, "+u.name)},
 register:()=>{const n=$("#un").value.trim(),e=$("#ue").value.trim().toLowerCase(),p=$("#up").value;
  if(!n||!/^\S+@\S+\.\S+$/.test(e)||p.length<6){$("#um").textContent="Enter your name, a valid email and a password of at least 6 characters.";return}
  if(db.users.some(x=>x.email===e)){$("#um").textContent="An account with this email already exists. Log in instead.";return}
  const u={id:db.next.u++,name:n,email:e,pass:p,role:"user"};db.users.push(u);uid=u.id;notify(u.id,"Welcome to VahanaShare! Browse vehicles and book your first ride.");save();close();render();toast("Account created")},
 book:v=>{
  if(!uid){authModal("login");return}
  const id=+v,a=$("#bf").value,b=$("#bt").value;
  if(!validRange(a,b)||busy(id,a,b).length){quote(id);return}
  const x=veh(id),total=days(a,b)*x.price;
  db.bookings.push({id:db.next.b++,vid:id,uid,from:a,to:b,total,status:"confirmed",created:iso(new Date())});
  notify(uid,`Booking confirmed: ${x.name} from ${a} to ${b}, total ${inr(total)}.`);
  save();close();render();toast("Booking confirmed");location.hash="bookings";render()},
 cancel:v=>{const b=db.bookings.find(x=>x.id===+v);if(!b||!confirm("Cancel this booking?"))return;
  b.status="cancelled";notify(b.uid,`Your booking for ${veh(b.vid)?.name||"a vehicle"} (${b.from} to ${b.to}) was cancelled.`);save();render();toast("Booking cancelled")},
 addv:()=>{const g=i=>$("#"+i).value.trim(),n=g("an"),p=+g("ap");
  if(!n||!(p>0)||!g("al")){$("#am").textContent="Enter a name, a price above zero and a pickup area.";return}
  db.vehicles.push({id:db.next.v++,name:n,type:g("at"),price:p,loc:g("al"),seats:+g("as")||1,desc:g("ad")||"No description yet.",active:true});save();render();toast("Vehicle added")},
 togv:v=>{const x=veh(+v);x.active=!x.active;save();render()},
 delv:v=>{if(!confirm("Delete this vehicle and keep its past bookings?"))return;db.vehicles=db.vehicles.filter(x=>x.id!==+v);save();render();toast("Vehicle deleted")}
};
document.addEventListener("click",e=>{
 if(e.target.classList.contains("modal")){close();return}
 const b=e.target.closest("[data-a]");if(!b||b.classList.contains("modal"))return;A[b.dataset.a]?.(b.dataset.v,b)});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="bf"||t.id==="bt"){quote(+$("#bf").dataset.vid||+$("#bb").dataset.v);return}
 const m={ff:["from"],ft:["to"],fy:["type"],fq:["q"],fm:["max"]}[t.id];
 if(m){f[m[0]]=t.value;results()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="Enter"&&$("#ue")&&e.target.tagName==="INPUT")($("#up").offsetParent&&document.querySelector('.dlg .btn:not(.alt)')).click()});
addEventListener("hashchange",render);
load();render();
</script>
